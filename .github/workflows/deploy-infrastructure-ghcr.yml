name: Build and Deploy Infrastructure (GHCR)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all services (ignore change detection)'
        required: false
        type: boolean
        default: false

jobs:
  # ─── Detect Changes ───────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      nginx: ${{ steps.filter.outputs.nginx }}
      certbot: ${{ steps.filter.outputs.certbot }}
      databases: ${{ steps.filter.outputs.databases }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      grafana: ${{ steps.filter.outputs.grafana }}
      prometheus: ${{ steps.filter.outputs.prometheus }}
      loki: ${{ steps.filter.outputs.loki }}
      promtail: ${{ steps.filter.outputs.promtail }}
      alertmanager: ${{ steps.filter.outputs.alertmanager }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nginx:
              - 'nginx/**'
            certbot:
              - 'certbot/**'
            databases:
              - 'databases/**'
            monitoring:
              - 'monitoring/**'
            grafana:
              - 'monitoring/grafana/**'
            prometheus:
              - 'monitoring/prometheus/**'
            loki:
              - 'monitoring/loki/**'
            promtail:
              - 'monitoring/promtail/**'
            alertmanager:
              - 'monitoring/alertmanager/**'

  # ─── Build Nginx ──────────────────────────────────────────────────────────
  build-nginx:
    needs: changes
    if: |
      github.event.inputs.force_deploy_all == 'true' ||
      needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infra-nginx:latest
            ghcr.io/${{ github.repository_owner }}/infra-nginx:${{ github.sha }}

  # ─── Build Grafana ────────────────────────────────────────────────────────
  build-grafana:
    needs: changes
    if: |
      github.event.inputs.force_deploy_all == 'true' ||
      needs.changes.outputs.grafana == 'true' ||
      needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Grafana image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          file: ./monitoring/grafana/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infra-grafana:latest
            ghcr.io/${{ github.repository_owner }}/infra-grafana:${{ github.sha }}

  # ─── Build Prometheus ─────────────────────────────────────────────────────
  build-prometheus:
    needs: changes
    if: |
      github.event.inputs.force_deploy_all == 'true' ||
      needs.changes.outputs.prometheus == 'true' ||
      needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Prometheus image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          file: ./monitoring/prometheus/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infra-prometheus:latest
            ghcr.io/${{ github.repository_owner }}/infra-prometheus:${{ github.sha }}

  # ─── Build Loki ───────────────────────────────────────────────────────────
  build-loki:
    needs: changes
    if: |
      github.event.inputs.force_deploy_all == 'true' ||
      needs.changes.outputs.loki == 'true' ||
      needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Loki image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          file: ./monitoring/loki/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infra-loki:latest
            ghcr.io/${{ github.repository_owner }}/infra-loki:${{ github.sha }}

  # ─── Build Promtail ───────────────────────────────────────────────────────
  build-promtail:
    needs: changes
    if: |
      github.event.inputs.force_deploy_all == 'true' ||
      needs.changes.outputs.promtail == 'true' ||
      needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Promtail image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          file: ./monitoring/promtail/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infra-promtail:latest
            ghcr.io/${{ github.repository_owner }}/infra-promtail:${{ github.sha }}

  # ─── Build Alertmanager ───────────────────────────────────────────────────
  build-alertmanager:
    needs: changes
    if: |
      github.event.inputs.force_deploy_all == 'true' ||
      needs.changes.outputs.alertmanager == 'true' ||
      needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Alertmanager image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          file: ./monitoring/alertmanager/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infra-alertmanager:latest
            ghcr.io/${{ github.repository_owner }}/infra-alertmanager:${{ github.sha }}

  # ─── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    needs: [changes, build-nginx, build-grafana, build-prometheus, build-loki, build-promtail, build-alertmanager]
    if: |
      always() &&
      (needs.build-nginx.result == 'success' || needs.build-nginx.result == 'skipped') &&
      (needs.build-grafana.result == 'success' || needs.build-grafana.result == 'skipped') &&
      (needs.build-prometheus.result == 'success' || needs.build-prometheus.result == 'skipped') &&
      (needs.build-loki.result == 'success' || needs.build-loki.result == 'skipped') &&
      (needs.build-promtail.result == 'success' || needs.build-promtail.result == 'skipped') &&
      (needs.build-alertmanager.result == 'success' || needs.build-alertmanager.result == 'skipped') &&
      (github.event.inputs.force_deploy_all == 'true' ||
       needs.changes.outputs.nginx == 'true' ||
       needs.changes.outputs.databases == 'true' ||
       needs.changes.outputs.monitoring == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tailscale disabled - using direct SSH via edu-hub.duckdns.org
      # - name: Setup Tailscale
      #   uses: tailscale/github-action@v2
      #   with:
      #     authkey: ${{ secrets.TS_AUTH_KEY }}
      #     tags: tag:ci

      - name: Deploy to Mac Mini
        uses: appleboy/ssh-action@v1
        with:
          request_pty: true
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # Create infrastructure directories
            mkdir -p ~/prod/infrastructure/{nginx,databases,monitoring,certbot}
            cd ~/prod/infrastructure

            # Set GITHUB_REPOSITORY_OWNER for image names
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            # Login to GHCR (for private packages)
            echo "🔐 Logging into GHCR..."
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Write nginx docker-compose.yml
            cat > ~/prod/infrastructure/nginx/docker-compose.yml << 'NGINX_COMPOSE'
            services:
              nginx:
                image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/infra-nginx:latest
                container_name: infra_nginx
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./logs:/var/log/nginx
                  - ../certbot/conf:/etc/letsencrypt:ro
                  - ../certbot/www:/var/www/certbot:ro
                networks:
                  - infra_network
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
                  interval: 10s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            networks:
              infra_network:
                name: infra_network
                external: true
            NGINX_COMPOSE

            # Write certbot docker-compose.yml
            cat > ~/prod/infrastructure/certbot/docker-compose.yml << 'CERTBOT_COMPOSE'
            services:
              certbot:
                image: certbot/certbot:latest
                container_name: infra_certbot
                restart: "no"
                volumes:
                  - ./conf:/etc/letsencrypt
                  - ./www:/var/www/certbot
                  - ./logs:/var/log/letsencrypt
                entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
                networks:
                  - infra_network
                deploy:
                  resources:
                    limits:
                      cpus: "0.25"
                      memory: 128M
                    reservations:
                      cpus: "0.05"
                      memory: 32M
            networks:
              infra_network:
                name: infra_network
                external: true
            CERTBOT_COMPOSE

            # Write certbot init script
            cat > ~/prod/infrastructure/certbot/init-letsencrypt.sh << 'CERTBOT_INIT'
            #!/bin/bash
            # Initialize Let's Encrypt certificates
            set -e

            DOMAIN="${DOMAIN:-edu-hub.duckdns.org}"
            EMAIL="${LETSENCRYPT_EMAIL:-admin@${DOMAIN}}"
            STAGING="${STAGING:-0}"

            CERTBOT_DIR="$(cd "$(dirname "$0")" && pwd)"
            CONF_DIR="${CERTBOT_DIR}/conf"
            WWW_DIR="${CERTBOT_DIR}/www"

            echo "🔐 Initializing Let's Encrypt for ${DOMAIN}"
            echo "📧 Email: ${EMAIL}"

            mkdir -p "$CONF_DIR" "$WWW_DIR"

            if [ -d "$CONF_DIR/live/$DOMAIN" ]; then
              echo "✅ Certificate already exists"
              exit 0
            fi

            STAGING_ARG=""
            if [ "$STAGING" != "0" ]; then
              echo "⚠️  Using staging environment"
              STAGING_ARG="--staging"
            fi

            if ! docker ps | grep -q infra_nginx; then
              echo "❌ nginx not running. Start it first: cd ../nginx && docker compose up -d"
              exit 1
            fi

            echo "🔑 Obtaining certificate..."
            docker run --rm \
              --name certbot_init \
              -v "$CONF_DIR:/etc/letsencrypt" \
              -v "$WWW_DIR:/var/www/certbot" \
              --network infra_network \
              certbot/certbot \
              certonly \
              --webroot \
              --webroot-path=/var/www/certbot \
              --email "$EMAIL" \
              --agree-tos \
              --no-eff-email \
              $STAGING_ARG \
              -d "$DOMAIN"

            if [ $? -eq 0 ]; then
              echo "✅ Certificate obtained!"
              cd "$CERTBOT_DIR"
              docker compose up -d certbot
              docker exec infra_nginx nginx -s reload
              echo "✅ Setup complete!"
            else
              echo "❌ Failed to obtain certificate"
              exit 1
            fi
            CERTBOT_INIT

            chmod +x ~/prod/infrastructure/certbot/init-letsencrypt.sh

            # Write databases docker-compose.yml
            cat > ~/prod/infrastructure/databases/docker-compose.yml << 'DB_COMPOSE'
            services:
              postgres:
                image: postgres:16
                container_name: infra_postgres
                restart: unless-stopped
                environment:
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
                  POSTGRES_USER: ${POSTGRES_USER:-postgres}
                ports:
                  - "127.0.0.1:5432:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - infra_network
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 5s
                  timeout: 5s
                  retries: 10
              redis:
                image: redis:7-alpine
                container_name: infra_redis
                restart: unless-stopped
                command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
                ports:
                  - "127.0.0.1:6379:6379"
                volumes:
                  - redis_data:/data
                networks:
                  - infra_network
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 5
            volumes:
              postgres_data:
              redis_data:
            networks:
              infra_network:
                name: infra_network
                external: true
            DB_COMPOSE

            # Write monitoring docker-compose.yml
            cat > ~/prod/infrastructure/monitoring/docker-compose.yml << 'MON_COMPOSE'
            services:
              prometheus:
                image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/infra-prometheus:latest
                container_name: infra_prometheus
                restart: unless-stopped
                ports:
                  - "9090:9090"
                volumes:
                  - prometheus_data:/prometheus
                networks:
                  - infra_network
              grafana:
                image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/infra-grafana:latest
                container_name: infra_grafana
                restart: unless-stopped
                environment:
                  - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
                  - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
                ports:
                  - "3000:3000"
                volumes:
                  - grafana_data:/var/lib/grafana
                networks:
                  - infra_network
                depends_on:
                  - prometheus
              loki:
                image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/infra-loki:latest
                container_name: infra_loki
                restart: unless-stopped
                ports:
                  - "3100:3100"
                volumes:
                  - loki_data:/loki
                networks:
                  - infra_network
              promtail:
                image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/infra-promtail:latest
                container_name: infra_promtail
                restart: unless-stopped
                volumes:
                  - /var/log:/var/log:ro
                  - /var/run/docker.sock:/var/run/docker.sock:ro
                  - ../nginx/logs:/mnt/nginx-logs:ro
                networks:
                  - infra_network
                depends_on:
                  - loki
              alertmanager:
                image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/infra-alertmanager:latest
                container_name: infra_alertmanager
                restart: unless-stopped
                ports:
                  - "9093:9093"
                volumes:
                  - alertmanager_data:/alertmanager
                networks:
                  - infra_network
              node-exporter:
                image: prom/node-exporter:latest
                container_name: infra_node_exporter
                restart: unless-stopped
                ports:
                  - "9100:9100"
                networks:
                  - infra_network
              cadvisor:
                image: gcr.io/cadvisor/cadvisor:latest
                container_name: infra_cadvisor
                restart: unless-stopped
                privileged: true
                ports:
                  - "8080:8080"
                volumes:
                  - /:/rootfs:ro
                  - /var/run:/var/run:ro
                  - /sys:/sys:ro
                  - /var/lib/docker/:/var/lib/docker:ro
                networks:
                  - infra_network
            volumes:
              prometheus_data:
              grafana_data:
              loki_data:
              alertmanager_data:
            networks:
              infra_network:
                name: infra_network
                external: true
            MON_COMPOSE

            # Create environment files if they don't exist
            if [ ! -f ~/prod/infrastructure/databases/.env ]; then
              echo "📝 Creating databases/.env file..."
              cat > ~/prod/infrastructure/databases/.env << 'DB_ENV'
            POSTGRES_PASSWORD=changeme_$(openssl rand -hex 16)
            POSTGRES_USER=postgres
            REDIS_PASSWORD=changeme_$(openssl rand -hex 16)
            DB_ENV
              echo "⚠️  Default passwords set. Change them in ~/prod/infrastructure/databases/.env"
            fi

            if [ ! -f ~/prod/infrastructure/monitoring/.env ]; then
              echo "📝 Creating monitoring/.env file..."
              cat > ~/prod/infrastructure/monitoring/.env << 'MON_ENV'
            GRAFANA_ADMIN_USER=admin
            GRAFANA_ADMIN_PASSWORD=admin_$(openssl rand -hex 16)
            MON_ENV
              echo "⚠️  Default Grafana password set. Change it in ~/prod/infrastructure/monitoring/.env"
            fi

            # Create necessary directories
            mkdir -p ~/prod/infrastructure/{nginx/logs,certbot/conf,certbot/www,certbot/logs}

            # Create Docker network if it doesn't exist
            if ! docker network inspect infra_network >/dev/null 2>&1; then
              echo "🌐 Creating Docker network..."
              docker network create infra_network
            fi

            # Create backup tag for rollback
            BACKUP_TAG="pre-deploy-$(date +%Y%m%d-%H%M%S)"
            echo "📌 Creating backup tag: $BACKUP_TAG"

            # Function to deploy a service
            deploy_service() {
              SERVICE=$1
              SERVICE_DIR=$2
              CONTAINER_PREFIX="infra_"

              echo "🚀 Deploying $SERVICE..."

              # Store current image for rollback
              CONTAINER_NAME="${CONTAINER_PREFIX}${SERVICE}"
              CURRENT_IMAGE=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "none")

              # Pull new image
              cd "$SERVICE_DIR"
              docker compose pull "$SERVICE" 2>/dev/null || true

              # Deploy with health check
              docker compose up -d --no-deps --force-recreate "$SERVICE"

              # Wait for health check
              echo "⏳ Waiting for $SERVICE health check..."
              RETRIES=0
              MAX_RETRIES=30
              until [ $RETRIES -eq $MAX_RETRIES ] || [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_NAME" 2>/dev/null)" = "healthy" ]; do
                sleep 2
                RETRIES=$((RETRIES+1))
                STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")

                # For services without healthcheck, check if running
                if [ "$STATUS" = "no-healthcheck" ]; then
                  if [ "$(docker inspect --format='{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null)" = "true" ]; then
                    echo "✅ $SERVICE is running (no healthcheck configured)"
                    cd ~/prod/infrastructure
                    return 0
                  fi
                fi

                echo "  Attempt $RETRIES/$MAX_RETRIES... status=$STATUS"
              done

              # Check if healthy
              FINAL_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")

              if [ "$FINAL_STATUS" != "healthy" ] && [ "$FINAL_STATUS" != "no-healthcheck" ]; then
                echo "❌ $SERVICE failed health check! Final status: $FINAL_STATUS"
                echo "📋 Container logs:"
                docker logs --tail=50 "$CONTAINER_NAME" || true

                echo "🔍 Container inspect:"
                docker inspect "$CONTAINER_NAME" | jq '.[]| {State: .State, Health: .State.Health}' || true

                echo "🔍 Testing nginx configuration..."
                docker exec "$CONTAINER_NAME" nginx -t || true

                echo "🔍 Testing health endpoint manually..."
                docker exec "$CONTAINER_NAME" wget -O- http://localhost/healthz || true
                docker exec "$CONTAINER_NAME" curl -v http://localhost/healthz || true

                echo "🔍 Checking if nginx is listening..."
                docker exec "$CONTAINER_NAME" netstat -tlnp || docker exec "$CONTAINER_NAME" ss -tlnp || true

                # Skip rollback for now to keep container running for debugging
                echo "⚠️  Keeping container running for debugging. Check logs on server."
                echo "   To manually rollback: cd ~/prod/infrastructure/$SERVICE_DIR && docker compose down"

                cd ~/prod/infrastructure
                exit 1
              fi

              echo "✅ $SERVICE deployed successfully!"
              cd ~/prod/infrastructure
            }

            # Deploy changed services
            FORCE_DEPLOY="${{ github.event.inputs.force_deploy_all }}"
            CHANGED_NGINX="${{ needs.changes.outputs.nginx }}"
            CHANGED_CERTBOT="${{ needs.changes.outputs.certbot }}"
            CHANGED_DATABASES="${{ needs.changes.outputs.databases }}"
            CHANGED_MONITORING="${{ needs.changes.outputs.monitoring }}"

            if [ "$FORCE_DEPLOY" = "true" ]; then
              echo "🚀 Force deploy enabled - deploying all services"
              CHANGED_NGINX="true"
              CHANGED_CERTBOT="true"
              CHANGED_DATABASES="true"
              CHANGED_MONITORING="true"
            fi

            # Deploy nginx if changed
            if [ "$CHANGED_NGINX" = "true" ]; then
              deploy_service "nginx" "nginx"
            fi

            # Deploy certbot if changed
            if [ "$CHANGED_CERTBOT" = "true" ]; then
              echo "🔐 Deploying Let's Encrypt certbot..."
              cd certbot
              docker compose up -d
              cd ..
            fi

            # Deploy databases if changed (only restart, no custom images)
            if [ "$CHANGED_DATABASES" = "true" ]; then
              echo "🗄️  Redeploying databases..."
              cd databases
              docker compose pull
              docker compose up -d
              cd ..
            fi

            # Deploy monitoring services if changed
            if [ "$CHANGED_MONITORING" = "true" ]; then
              # Deploy services individually with health checks
              deploy_service "prometheus" "monitoring"
              deploy_service "grafana" "monitoring"
              deploy_service "loki" "monitoring"
              deploy_service "promtail" "monitoring"
              deploy_service "alertmanager" "monitoring"

              # Deploy remaining services without custom images
              echo "🚀 Deploying remaining monitoring services..."
              cd monitoring
              docker compose up -d node-exporter cadvisor
              cd ..
            fi

            # Final health check
            echo "🏥 Running final health checks..."
            sleep 10

            # Check all containers are running
            FAILED_CONTAINERS=$(docker ps -a --filter "name=infra_" --filter "status=exited" --format "{{.Names}}" || echo "")
            if [ -n "$FAILED_CONTAINERS" ]; then
              echo "❌ Some containers failed to start:"
              echo "$FAILED_CONTAINERS"
              exit 1
            fi

            # Cleanup
            docker system prune -f

            echo "✅ Infrastructure deployment complete!"
            echo "📊 Running services:"
            docker ps --filter "name=infra_" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Deployment status notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Infrastructure deployment successful!"
          else
            echo "❌ Infrastructure deployment failed!"
          fi
