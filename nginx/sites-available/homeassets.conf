# Temporary HTTP server for development/testing (comment out after HTTPS setup)
server {
    listen 80;
    server_name homeassets.local homeassets.yourdomain.com;

    # Logging
    access_log /var/log/nginx/homeassets-access.log;
    error_log /var/log/nginx/homeassets-error.log;

    # API endpoints - proxy to backend
    location /api/ {
        proxy_pass http://homeassets_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;

        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://homeassets_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend - proxy to Vite dev server
    location / {
        proxy_pass http://homeassets_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket support for Vite HMR
    location /ws {
        proxy_pass http://homeassets_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Static files (uploads, assets)
    location /uploads/ {
        proxy_pass http://homeassets_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
