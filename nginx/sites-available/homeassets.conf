# ============================================================================
# HomeAssets - Asset Management System
# ============================================================================
# This configuration proxies requests to the HomeAssets application
# Frontend: React + Vite
# Backend: NestJS API
# ============================================================================

upstream homeassets_backend {
    server 172.23.0.4:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream homeassets_frontend {
    server 172.23.0.5:5173 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

