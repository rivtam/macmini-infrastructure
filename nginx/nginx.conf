events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Include all site configurations
    include /etc/nginx/sites-enabled/*.conf;

    # Default HTTP server - for ACME challenges and initial setup
    # After obtaining SSL certificates, this will redirect to HTTPS
    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for Docker
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # ACME challenge for Let's Encrypt - MUST be accessible via HTTP
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Temporary response before HTTPS is configured
        # TODO: After running init-letsencrypt.sh, uncomment the redirect below
        location / {
            default_type text/plain;
            return 200 'Infrastructure nginx is running. To enable HTTPS, run: cd ~/prod/infrastructure/certbot && ./init-letsencrypt.sh';
        }

        # Redirect to HTTPS (uncomment after obtaining SSL certificates)
        # location / {
        #     return 301 https://$host$request_uri;
        # }
    }

