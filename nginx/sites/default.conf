# Infrastructure Nginx - Default Configuration
# Service-specific configurations can be added later

# HTTP Server
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ACME challenge for Let's Encrypt (for future SSL setup)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Default response
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Infrastructure Nginx</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <h1>Infrastructure Nginx</h1>
    <p>Reverse proxy is running. Service configurations will be added later.</p>
</body>
</html>';
    }
}
